# Blacklist mainline RTW88 drivers for RTL8723DS
# Use vendor driver (8723ds.ko from lwfinger/rtl8723ds) instead
# The vendor driver is more stable than the mainline rtw88_8723ds

# Blacklist the SDIO variant of RTL8723D mainline driver
blacklist rtw88_8723ds
blacklist rtw88_8723d
blacklist rtw88_8723x
blacklist rtw88_sdio
blacklist rtw88_core

# Force the vendor driver to load
# The vendor module is named "8723ds" (without rtw88_ prefix)
options 8723ds rtw_power_mgnt=0 rtw_enusbss=0
