# RTL8723DS vendor driver alias configuration
# This ensures the vendor driver (8723ds.ko) loads for the RTL8723DS SDIO device

# SDIO device alias - RTL8723DS WiFi
alias sdio:c*v024CdD723* 8723ds

# Install hook: load vendor driver instead of mainline
install rtw88_8723ds /bin/false
install rtw88_8723d /bin/false
install rtw88_sdio /bin/false
